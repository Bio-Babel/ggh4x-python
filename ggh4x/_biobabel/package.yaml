# Generated by `biobabel new contract`.
# Fields tagged TODO must be filled before this contract is useful.
# Run `biobabel validate package --pkg ggh4x --strict` after editing.
schema_version: 1
repo: "https://github.com/Bio-Babel/ggh4x-python"
distribution: ggh4x-python
import_name: ggh4x
display_name: ggh4x
contract_class: grammar
tier: 2
maturity: beta
r_package:
  package: ggh4x
  repo: "https://github.com/teunbrand/ggh4x"
  version_or_commit: "63c91b7"
  fidelity: partial
foundation:
  - ggplot2_py
capabilities:
  - extended-facets
  - nested-strips
  - per-panel-scales
  - forced-panel-sizes
  - custom-stat-layers
  - custom-geoms
  - multi-scale-layering
  - manual-panel-layout
domain_tags:
  - visualization
  - ggplot2-extension
task_tags:
  - faceted-plots
  - hierarchical-facet-labels
  - per-panel-scale-customization
  - panel-size-control
  - custom-stat-layers
  - legend-customization
triggers:
  - "hierarchical/nested facet strip labels for multiple grouping variables"
  - "facet panels need independent per-row/column position scales"
  - "manual custom panel layout where one panel spans multiple grid cells"
  - "forcing panel sizes to be absolute or proportionally equal"
  - "multiple colour or fill scales layered on one ggplot"
  - "fitting and drawing a theoretical probability distribution over data"
  - "kernel-smoothed trend line without fitting a parametric model"
  - "signed difference / crossover ribbon between two series"
  - "run-length-encoded interval rectangles from a labeling variable"
  - "text labels that must rotate to aim at a target point"
  - "axes drawn inside the panel at a data-coordinate origin"
  - "compact string-based legend instead of geom-key swatches"
not_when:
  - "the plotting backend is not ggplot2_py (e.g. matplotlib or plotnine workflows) — ggh4x subclasses ggplot2_py's ggproto facets/stats/geoms/scales/coords/positions directly and is not a generic plotting wrapper"
  - "only vanilla ggplot2_py facet_wrap/facet_grid behavior is needed with no extra strip, per-panel-scale, or panel-size customization"
  - "a general-purpose statistical summary is needed with no theoretical-distribution, rolling-kernel, signed-difference, or run-length-encoding semantics"
templates:
  - id: ggh4x.facets_tutorial
    path: templates/facets_tutorial.py
    task_tags:
      - faceted-plots
      - hierarchical-facet-labels
      - panel-size-control
    description: "End-to-end port of tutorials/Facets.ipynb: extended/nested facets, per-strip theming, per-panel scales, forced panel sizes."
    code_template: ''
  - id: ggh4x.miscellaneous_tutorial
    path: templates/miscellaneous_tutorial.py
    task_tags:
      - legend-customization
    description: "End-to-end port of tutorials/Miscellaneous.ipynb: multiple colour scales, extra geoms, linear-transform position, axes inside the panel."
    code_template: ''
  - id: ggh4x.statistics_tutorial
    path: templates/statistics_tutorial.py
    task_tags:
      - custom-stat-layers
    description: "End-to-end port of tutorials/Statistics.ipynb: theoretical density fits, rolling kernels, signed differences, x/y summaries, run-length encoding."
    code_template: ''
