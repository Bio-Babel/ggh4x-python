id: ggh4x.StatTheoDensity
import_path: ggh4x.stat_theodensity.StatTheoDensity
kind: class
signature: "class StatTheoDensity(StatDensity)"
purpose: "ggproto Stat that fits a theoretical distribution's parameters by MLE and evaluates its pdf/pmf on a grid."
description: >
  Subclass of ggplot2_py's StatDensity that replaces the kernel-density
  compute_group with theoretical-distribution MLE fitting. Not directly
  instantiated by users; built and configured via `stat_theodensity()`.
  `setup_params` remaps `chisq` to `gamma(rate=0.5)` internally and
  auto-fixes `binom`'s `size` parameter to `max(x)` when not user-supplied.
  On failure (fewer than 2 points, or MLE non-convergence) `compute_group`
  returns a single-row all-NaN "nulldata" frame with a warning rather than
  raising.
parameters: []
mutates: "execution_class=pure_function; compute_group/setup_params return new DataFrames/dicts, no in-place mutation of caller state; returns_kind=new_object"
returns: "N/A (class); compute_group returns a pandas.DataFrame with columns x, density, scaled, count, n."
requires: []
writes: []
examples: []
failure_fixes: []
related:
  - ggh4x.stat_theodensity
