id: ggh4x.stat_midpoint
import_path: ggh4x.stat_funxy.stat_midpoint
kind: function
signature: "def stat_midpoint(mapping=None, data=None, geom='point', position='identity', *, argx=None, argy=None, crop_other=True, show_legend=None, inherit_aes=True, **kwargs)"
purpose: "Compute and draw the group midpoint: (min+max)/2 of x and of y."
description: >
  Convenience wrapper around `stat_funxy()` that hardcodes
  `funx=funy=midpoint` (unlike `stat_centroid`, it exposes no
  `funx`/`funy` parameters at all). `argx`/`argy` default to
  `{"na_rm": True}` when not supplied. Commonly layered alongside
  `stat_centroid()` to compare centroid vs range-midpoint group labels on
  the same plot.
parameters:
  - name: mapping
    type: Mapping
    required: false
    default: "None"
    description: "aes() mapping; requires x and y."
  - name: data
    type: Any
    required: false
    default: "None"
    description: "Layer data or callable."
  - name: geom
    type: str
    required: false
    default: "'point'"
    description: "Geometry used to render the layer."
  - name: position
    type: str
    required: false
    default: "'identity'"
    description: "Position adjustment."
  - name: argx
    type: dict
    required: false
    default: "{'na_rm': True}"
    description: "Named kwargs forwarded to the midpoint function for x."
  - name: argy
    type: dict
    required: false
    default: "{'na_rm': True}"
    description: "Named kwargs forwarded to the midpoint function for y."
  - name: crop_other
    type: bool
    required: false
    default: "True"
    description: "Crop other columns to the result length before recycling."
  - name: show_legend
    type: bool
    required: false
    default: "None"
    description: "Whether to show the layer in the legend."
  - name: inherit_aes
    type: bool
    required: false
    default: "True"
    description: "Whether to inherit plot aesthetics."
  - name: kwargs
    type: Any
    required: false
    description: "Other layer args."
mutates: "execution_class=pure_function; delegates entirely to stat_funxy; returns_kind=new_object"
returns: "A ggplot2_py Layer backed by StatFunxy with funx=funy=midpoint."
requires: []
writes: []
examples:
  - "stat_midpoint(geom='point', color='limegreen', size=4)"
failure_fixes: []
related:
  - ggh4x.stat_funxy
  - ggh4x.StatFunxy
  - ggh4x.stat_centroid
