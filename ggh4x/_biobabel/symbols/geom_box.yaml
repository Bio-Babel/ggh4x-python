id: ggh4x.geom_box
import_path: ggh4x.geom_box.geom_box
kind: function
signature: "def geom_box(mapping=None, data=None, stat='identity', position='identity', linejoin='mitre', na_rm=False, show_legend=None, inherit_aes=True, radius=None, **kwargs)"
purpose: "A more flexible geom_rect/geom_tile accepting any two of min/max/center/dim per axis."
description: >
  Accepts `optional_aes = (xmin, xmax, x, width, ymin, ymax, y, height)` and
  resolves the actual box bounds from whichever two of
  min/max/center/dimension are supplied per axis (via the internal
  `resolve_box()` helper), rather than requiring a fixed set like
  `geom_rect`. `radius` (a grid unit, numeric, or None) draws rounded
  corners in mm under linear coords; it is ignored under non-linear coords,
  where each rect is instead expanded to a 5-vertex polygon and delegated
  to `GeomPolygon`.
parameters:
  - name: mapping
    type: Mapping
    required: false
    default: "None"
    description: "aes() mapping."
  - name: data
    type: Any
    required: false
    default: "None"
    description: "Layer data or callable."
  - name: stat
    type: str
    required: false
    default: "'identity'"
    description: "Stat used to transform the data."
  - name: position
    type: str
    required: false
    default: "'identity'"
    description: "Position adjustment."
  - name: linejoin
    type: str
    required: false
    default: "'mitre'"
    description: "Line join style."
  - name: na_rm
    type: bool
    required: false
    default: "False"
    description: "Remove NA silently when True."
  - name: show_legend
    type: Any
    required: false
    default: "None"
    description: "Whether to show the layer in the legend."
  - name: inherit_aes
    type: bool
    required: false
    default: "True"
    description: "Whether to inherit plot aesthetics."
  - name: radius
    type: Any
    required: false
    default: "None"
    description: "Grid unit / numeric (mm) / None; rounded-corner radius, ignored under non-linear coords."
  - name: kwargs
    type: Any
    required: false
    description: "Extra aesthetics/params."
mutates: "execution_class=pure_function; no in-place mutation; returns_kind=new_object"
returns: "A ggplot2_py Layer backed by GeomBox."
requires: []
writes: []
examples:
  - "geom_box(aes(xmin='xmin', xmax='xmax', ymin='ymin', ymax='ymax'))"
failure_fixes: []
related:
  - ggh4x.GeomBox
