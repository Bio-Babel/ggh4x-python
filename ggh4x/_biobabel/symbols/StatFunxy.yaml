id: ggh4x.StatFunxy
import_path: ggh4x.stat_funxy.StatFunxy
kind: class
signature: "class StatFunxy(Stat)"
purpose: "ggproto Stat applying per-group summary functions to x and y independently."
description: >
  `required_aes = ["x", "y"]`. Not directly instantiated by users; built and
  configured via `stat_funxy()`/`stat_centroid()`/`stat_midpoint()`. Applies
  `funx`/`funy` to a group's x/y values, then reconciles/recycles remaining
  columns' lengths against the result via `vec_recycle_common`, preserving
  R's exact output column order (other columns, then x, then y).
parameters: []
mutates: "execution_class=pure_function; computes new arrays and returns a freshly built DataFrame; does not mutate the input data; returns_kind=new_object"
returns: "N/A (class); compute_group returns a pandas.DataFrame with other columns followed by x, then y."
requires: []
writes: []
examples: []
failure_fixes: []
related:
  - ggh4x.stat_funxy
