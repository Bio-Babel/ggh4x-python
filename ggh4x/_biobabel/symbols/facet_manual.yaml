id: ggh4x.facet_manual
import_path: ggh4x.facet_manual.facet_manual
kind: function
signature: "def facet_manual(facets, design=None, widths=None, heights=None, respect=False, drop=True, strip_position='top', scales='fixed', axes='margins', remove_labels='none', labeller='label_value', trim_blank=True, strip='vanilla')"
purpose: "Facet with a user-specified manual panel layout, where panels can span arbitrary rectangles of a design grid."
description: >
  Unlike `facet_grid2`/`facet_wrap2`/`facet_nested*` (all of which
  auto-compute panel placement from cross-products of facet variables),
  `design=` explicitly specifies where each panel goes. `design` is either
  a character "art-string" (each line one design row; `'#'` marks a blank
  cell; other distinct characters are panel-id labels, e.g.
  `"A##\nAB#\n#BC\n##C"`) or a numeric/array matrix (`NaN` marks blank
  cells; non-blank values are renumbered 1..k in sorted order). `design`
  cannot be `None`. `widths`/`heights` accept plain numerics (coerced to
  relative `"null"` grid units) or explicit `grid_py.Unit`s. If `facets`
  resolves to zero variables, returns a plain `FacetNull` instead of a
  `FacetManual`.
parameters:
  - name: facets
    type: Any
    required: true
    description: "Faceting variable(s) (formula/list/dict/str)."
  - name: design
    type: Any
    required: false
    default: "None"
    description: "Character art-string or numeric/array matrix specifying panel placement; cannot be None."
  - name: widths
    type: Any
    required: false
    default: "None"
    description: "Numeric or grid_py.Unit cell widths, recycled to the design's column count."
  - name: heights
    type: Any
    required: false
    default: "None"
    description: "Numeric or grid_py.Unit cell heights, recycled to the design's row count."
  - name: respect
    type: bool
    required: false
    default: "False"
    description: "Whether 'null' widths/heights are proportional."
  - name: drop
    type: bool
    required: false
    default: "True"
    description: "Drop unused factor levels."
  - name: strip_position
    type: str
    required: false
    default: "'top'"
    description: "'top'/'bottom'/'left'/'right'."
  - name: scales
    type: Any
    required: false
    default: "'fixed'"
    description: "'fixed'/'free_x'/'free_y'/'free' or bool."
  - name: axes
    type: Any
    required: false
    default: "'margins'"
    description: "'margins'/'x'/'y'/'all' or bool."
  - name: remove_labels
    type: Any
    required: false
    default: "'none'"
    description: "'none'/'x'/'y'/'all' or bool."
  - name: labeller
    type: Any
    required: false
    default: "'label_value'"
    description: "Callable or str controlling strip label text."
  - name: trim_blank
    type: bool
    required: false
    default: "True"
    description: "Trim the design to its bounding box of non-empty rows/columns."
  - name: strip
    type: Any
    required: false
    default: "'vanilla'"
    description: "Strip / factory callable / str spec, resolved via resolve_strip."
mutates: "execution_class=pure_function; no in-place mutation; returns_kind=new_object"
returns: "A FacetManual instance, or a plain ggplot2_py FacetNull if facets resolves to zero variables."
requires: []
writes: []
examples:
  - "facet_manual(vars('drv'), design=np.array([[1, 3], [2, 2]]))"
  - "facet_manual(vars('drv'), design='A##\\nAB#\\n#BC\\n##C', heights=[4, 3, 2, 1], widths=unit([1, 2, 3], 'cm'))"
failure_fixes:
  - when: "design is None."
    suggest:
      - "Pass a character art-string or a numeric/array matrix as design."
    explanation: "facet_manual(facets, design=None) raises ValueError via cli_abort('The `design` argument cannot be `None`.') (test_validate_design_none_raises)."
  - when: "A character design string has lines of unequal length."
    suggest:
      - "Make every non-blank line of the design string the same length."
    explanation: "A design like 'AB\\nABC' raises ValueError via cli_abort('The `design` argument must be rectangular.') (test_validate_design_non_rectangular_raises)."
  - when: "There are more facet-level combinations than panels in the design."
    suggest:
      - "Add more panel ids to design, or reduce the number of distinct facet-variable combinations."
    explanation: "FacetManual.compute_layout emits cli_warn('Found more facetting levels than designed. The following levels are dropped: ...') and drops the extra levels rather than raising."
related:
  - ggh4x.FacetManual
  - ggh4x.resolve_strip
