[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggh4x-python"
version = "0.3.1.9000+63c91b7"
description = "Python port of the R ggh4x package"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "ggplot2-python>=4.0.2",
    "rgrid-python>=4.5.3",
    "gtable-python>=0.3.6",
    "scales-python>=1.4.0",
    "patchwork-python>=1.3.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
docs = ["mkdocs", "mkdocstrings[python]", "mkdocs-material", "mkdocs-jupyter"]

[tool.hatch.build.targets.wheel]
packages = ["ggh4x"]

[tool.hatch.build.targets.wheel.force-include]
"tutorials" = "ggh4x/tutorials"

[tool.hatch.build.targets.sdist]
include = ["ggh4x", "tutorials", "docs", "mkdocs.yml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
