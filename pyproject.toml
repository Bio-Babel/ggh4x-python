[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggh4x-python"
version = "0.3.1.9000"
description = "Python port of the R ggh4x package"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jeffery Liu", email = "jeffliu.lucky@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "ggplot2-python>=4.0.2",
    "rgrid-python>=4.5.3",
    "gtable-python>=0.3.6",
    "scales-python>=1.4.0",
    "patchwork-python>=1.3.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
docs = ["mkdocs", "mkdocstrings[python]", "mkdocs-material", "mkdocs-jupyter"]

[project.urls]
Homepage = "https://github.com/Bio-Babel/ggh4x-python"
Issues = "https://github.com/Bio-Babel/ggh4x-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["ggh4x"]

[tool.hatch.build.targets.sdist]
include = ["ggh4x", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
